<!DOCTYPE html>
<html>
<head>
<script>
  // Inject theme immediately before page loads in iframe
  window.onload = function() {
    var f = document.getElementById('f');
    f.onload = function() {
      try {
        var d = f.contentDocument || f.contentWindow.document;
        document.documentElement.classList.remove('dark');localStorage.setItem('cp-theme','light');
      } catch(e) {}
    };
    f.src = "http://192.168.1.19:5173/dashboard?t=light";
  };
</script>
<style>
  * { margin:0;padding:0;box-sizing:border-box; }
  body { width:1440px; overflow:hidden; }
  iframe { width:1440px; height:900px; border:none; display:block; }
</style>
</head>
<body>
<iframe id="f"></iframe>
</body>
</html>
